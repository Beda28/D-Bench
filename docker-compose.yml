services:
  frontend-builder:
    build:
      context: ./D-Front
      dockerfile: Dockerfile
    volumes:
      - frontend-dist:/shared-dist
    networks:
      - d-bench-network
    restart: "no"

  backend:
    build:
      context: ./D-Back
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - d-bench-network
      - d-bench-db-network
    restart: unless-stopped

  database:
    build:
      context: ./D-MySQL
      dockerfile: Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - d-bench-db-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  nginx:
    build:
      context: ./D-Nginx
      dockerfile: Dockerfile
    depends_on:
      frontend-builder:
        condition: service_completed_successfully
      backend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    networks:
      - d-bench-network
    restart: unless-stopped

volumes:
  frontend-dist:
    name: d-bench-frontend-dist
  mysql-data:
    name: d-bench-mysql-data

networks:
  d-bench-network:
    name: d-bench-network
    driver: bridge
  d-bench-db-network:
    name: d-bench-db-network
    driver: bridge
